  base09: "#CC832B" # Orange
  base0A: "#FBA922" # Yellow
  base0B: "#198844" # Green
  base0C: "#2BC4CC" # Cyan
  base0D: "#3971ED" # Blue
  base0E: "#A36AC7" # Purple
  base0F: "#CC342B" # Deprecated
